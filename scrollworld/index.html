<!doctype html>
<html lang="pt-br">
<head>

<link rel="icon" href="../assets/logo-icone.png?v=1" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Tokens do engine puxados da propria landing (index.html :root) para o
     mundo nao destoar do resto do site. O fundo casa com o das cenas
     (#f4f4f4), senao o poster aparece dentro de uma caixa de cor diferente. */
  :root{
    --sw-bg:#f4f4f4;
    --sw-ink:#171a20;
    --sw-ink-soft:#5c5e62;
    --sw-accent:#06b6d4;
    --sw-font-display:'Inter',system-ui,sans-serif;
    --sw-font-body:'Inter',system-ui,sans-serif;
  }
  html,body{margin:0;background:var(--sw-bg)}
</style>
</head>
<body>
<div id="world"></div>
<script src="assets/scrub-engine.js"></script>
<script>
mountScrollWorld(document.getElementById('world'), {

  hint: 'role para voar',
  nav: true,
  atmosphere: true,
  diveScroll: 1.35,
